# The complete Evo stack for local development: the APIs, the Workers and the home site,
# and the services that they use. Every variable and secret has a default value in this
# file, so the stack starts with no setup. The defaults are for a local machine only.
#
# The Migrations programs are not in the stack. Run them from the command line against
# the PostgreSQL of the stack: see README.md in this folder.
#
# Start it from Visual Studio: the project "docker-compose", launch profile "Docker Compose".
# Or from the repository root:
#
#   make up
#
# Put the values of your own machine in docker-compose.override.yml, in this folder.
# Git ignores that file. Start from docker-compose.override.example.yml.
#
# A host port is the usual port of the service plus 100. The stack can then run next to
# a project that runs with `dotnet run`, and next to a local PostgreSQL.
#
# See README.md in this folder.

name: evo

services:

  # ----- Darwin -----

  evo.darwin.api:
    image: ${DOCKER_REGISTRY-}evo-darwin-api
    build:
      context: ../..
      dockerfile: src/Darwin/Evo.Darwin.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "5180:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  evo.darwin.worker:
    image: ${DOCKER_REGISTRY-}evo-darwin-worker
    build:
      context: ../..
      dockerfile: src/Darwin/Evo.Darwin.Worker/Dockerfile
      additional_contexts:
        krapka: ../../../krapka
    environment:
      DOTNET_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----- Galaxy -----

  evo.galaxy.api:
    image: ${DOCKER_REGISTRY-}evo-galaxy-api
    build:
      context: ../..
      dockerfile: src/Galaxy/Evo.Galaxy.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "5181:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  evo.galaxy.worker:
    image: ${DOCKER_REGISTRY-}evo-galaxy-worker
    build:
      context: ../..
      dockerfile: src/Galaxy/Evo.Galaxy.Worker/Dockerfile
      additional_contexts:
        krapka: ../../../krapka
    environment:
      DOTNET_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----- Home -----

  # Serves the pages from the folder of the site. A change to a page shows after a reload.
  evo.home.site:
    image: nginx:1.30-alpine
    ports:
      - "8180:80"
    volumes:
      - ../Home/Evo.Home.Site:/usr/share/nginx/html:ro

  # ----- Services that the components use -----

  # One server with two databases: darwin and galaxy. postgres/init-databases.sql creates
  # them empty. The Migrations programs create the tables.
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5532:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      # Over TCP, so that the check fails while the server still runs the init script.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The management UI is on the second port. Log in with the user and the password below.
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: evo
      RABBITMQ_DEFAULT_PASS: evo
    ports:
      - "5772:5672"
      - "15772:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "--quiet", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  # The data of PostgreSQL. It stays when the stack stops.
  postgres-data:
