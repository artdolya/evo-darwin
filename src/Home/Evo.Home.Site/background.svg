<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
        <radialGradient id="space" cx="50%" cy="46%" r="75%">
            <stop offset="0" stop-color="#1a2352"/>
            <stop offset="0.55" stop-color="#0b1026"/>
            <stop offset="1" stop-color="#04060f"/>
        </radialGradient>
    </defs>
    <!-- The gradient is stretched to the whole page. -->
    <rect width="100%" height="100%" fill="url(#space)"/>
