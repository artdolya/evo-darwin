name: CD

# Builds the container image from main and deploys it to dev, then staging,
# then prod. The procedure is described in docs/runbooks/deploy.md.
#
# TODO: in the repository settings create the GitHub environments "dev",
# "staging" and "prod", and add required reviewers to "staging" and "prod".
# Until the reviewers are set, the staging and prod jobs do not wait for
# approval: they run as soon as the previous job succeeds.

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.15.6"
  # TODO: create the repository variable IMAGE_REPOSITORY with the image
  # repository without a tag (<registry>/<path>/evo-darwin). The registry is
  # not chosen yet. terraform-plan.yml reads the same variable.
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
  # Every image is tagged with the commit it was built from.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check that the image repository is configured
        run: |
          if [ -z "$IMAGE_REPOSITORY" ]; then
            echo "::error::The repository variable IMAGE_REPOSITORY is not set. See the TODOs in .github/workflows/cd.yml."
            exit 1
          fi

      # TODO: log in to the container registry before the build step. The
      # registry and its credentials are not known yet.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}

  deploy-dev:
    name: Deploy to dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    # One deployment to an environment at a time. A later run waits.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: deploy/terraform/environments/dev
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # TODO: authenticate to the cloud provider with the dev credentials.

      # TODO: give Terraform access to the dev cluster
      # (see deploy/terraform/environments/dev/providers.tf).

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # TODO: this keeps the state between runs only after the remote backend
      # is configured in deploy/terraform/environments/dev/versions.tf.
      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var "image_repository=$IMAGE_REPOSITORY" \
            -var "image_tag=$IMAGE_TAG"

  deploy-staging:
    name: Deploy to staging
    needs: deploy-dev
    runs-on: ubuntu-latest
    # Waits for approval by the required reviewers of the GitHub environment.
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: deploy/terraform/environments/staging
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # TODO: authenticate to the cloud provider with the staging credentials.

      # TODO: give Terraform access to the staging cluster
      # (see deploy/terraform/environments/staging/providers.tf).

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # TODO: this keeps the state between runs only after the remote backend
      # is configured in deploy/terraform/environments/staging/versions.tf.
      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var "image_repository=$IMAGE_REPOSITORY" \
            -var "image_tag=$IMAGE_TAG"

  deploy-prod:
    name: Deploy to prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Waits for approval by the required reviewers of the GitHub environment.
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: deploy/terraform/environments/prod
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # TODO: authenticate to the cloud provider with the prod credentials.

      # TODO: give Terraform access to the prod cluster
      # (see deploy/terraform/environments/prod/providers.tf).

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # TODO: this keeps the state between runs only after the remote backend
      # is configured in deploy/terraform/environments/prod/versions.tf.
      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var "image_repository=$IMAGE_REPOSITORY" \
            -var "image_tag=$IMAGE_TAG"
