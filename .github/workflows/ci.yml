name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The link src/Krapka points to a Krapka checkout next to this
      # repository. The Krapka projects are built from that source. See
      # docs/adr/0004-krapka-as-source.md.
      # TODO: this builds the newest commit of Krapka, which can change
      # between two runs. Pin a commit if the build must be repeatable.
      - name: Check out Krapka
        run: git clone --depth 1 https://github.com/artdolya/krapka.git ../krapka

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Fails when `dotnet format` would change a file. The rules are in .editorconfig.
      # The Krapka sources belong to another repository and are not checked.
      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore --exclude src/Krapka

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
